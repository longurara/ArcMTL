name: Build ArcMTL (macOS 26 Tahoe & macOS 15 Sequoia)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos26-x86_64:
    name: Build Full Stack on macOS 26 Tahoe (x86_64, supports 26 & 15)
    runs-on: macos-26-intel

    steps:
      - name: Checkout ArcMTL repository
        uses: actions/checkout@v4

      - name: Inspect macOS 26 Tahoe & Xcode environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Validate installer safety, fence waits and ring command packets
        run: |
          bash -n package/install_opencore_userspace.sh
          python3 tests/test_installer_logging.py
          python3 tests/test_arcxe_wait.py
          python3 tests/test_arcxe_ring.py
          python3 tests/test_arcxe_init.py
          python3 tests/test_arcxe_tlb.py
          python3 tests/test_arcxe_batch_dump.py
          python3 plugin/adapt_arc_plugin.py --self-test

      - name: Build Kernel Extensions (ArcXe, ArcFB + ArcAccel for macOS 26 & macOS 15)
        run: |
          chmod +x kexts/*/build.sh build/*.sh scripts/*.sh package/*.sh
          bash kexts/ArcXe/build.sh "$PWD/out/kexts"
          bash kexts/ArcFB/build.sh "$PWD/out/kexts"
          ARC_TAHOE=0 bash kexts/ArcAccel/build.sh "$PWD/out/kexts/15"
          ARC_TAHOE=1 bash kexts/ArcAccel/build.sh "$PWD/out/kexts/26"
          ditto "$PWD/out/kexts/26/ArcAccel.kext" "$PWD/out/kexts/ArcAccel.kext"

      - name: Verify macOS 26 Tahoe Kernel Linking with Apple kmutil (AuxKC Pre-flight)
        run: |
          STAGE="$(mktemp -d /var/tmp/arcmtl_ci26_kc.XXXXXX)"
          mkdir -p "$STAGE/Extensions"
          sudo ditto "out/kexts/ArcXe.kext" "$STAGE/Extensions/ArcXe.kext"
          sudo ditto "out/kexts/ArcFB.kext" "$STAGE/Extensions/ArcFB.kext"
          sudo ditto "out/kexts/26/ArcAccel.kext" "$STAGE/Extensions/ArcAccel.kext"
          sudo chown -R root:wheel "$STAGE/Extensions"
          sudo chmod -R 755 "$STAGE/Extensions"
          KB="/System/Library/KernelCollections/BootKernelExtensions.kc"
          [ -f "$KB" ] || KB="/Library/Apple/System/Library/KernelCollections/BootKernelExtensions.kc"
          KS="/System/Library/KernelCollections/SystemKernelExtensions.kc"
          [ -f "$KS" ] || KS="/Library/Apple/System/Library/KernelCollections/SystemKernelExtensions.kc"
          KM_ARGS=(--allow-missing-kdk)
          [ -f "/System/Library/Kernels/kernel" ] && KM_ARGS+=(--kernel "/System/Library/Kernels/kernel")
          sudo kmutil create -n aux \
            --volume-root / \
            "${KM_ARGS[@]}" \
            -B "$KB" -S "$KS" \
            --repository "$STAGE/Extensions" \
            -A "$STAGE/test_aux.kc" -z
          kmutil inspect -a x86_64 -A "$STAGE/test_aux.kc" | grep -E "com\.arc\.(ArcXe|ArcFB|ArcAccel)"
          sudo rm -rf "$STAGE"

      - name: Install Userspace Toolchain Dependencies (Homebrew + Python)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          pkgs=()
          for f in ccache meson ninja pkgconf bison flex glslang llvm spirv-llvm-translator spirv-tools libclc; do
            brew list --versions "$f" >/dev/null 2>&1 || pkgs+=("$f")
          done
          if [ "${#pkgs[@]}" -gt 0 ]; then
            brew install "${pkgs[@]}"
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            brew install rust
          elif command -v rustup >/dev/null 2>&1; then
            rustup target add x86_64-apple-darwin || true
          fi
          python3 -m pip install --user --break-system-packages mako pyyaml packaging || \
            pip3 install --user mako pyyaml packaging

      - name: Restore Cargo & ccache Build Cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/ccache
            ~/.cache/ccache
            build/xlate-target
          key: arcmtl-macos26-x86_64-mesa26.2.6-${{ github.sha }}
          restore-keys: |
            arcmtl-macos26-x86_64-mesa26.2.6-
            arcmtl-macos26-x86_64-

      - name: Fetch & Patch Third-Party Sources (Vulkan-Headers, Mesa 26.2.6, NullMoth)
        run: |
          bash scripts/fetch_deps.sh

      - name: Build Rust AIR -> SPIR-V Translator (libarcmtl_translate.dylib)
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          bash build/build_xlate.sh

      - name: Build Mesa Intel ANV Vulkan 1.3 ICD (libvulkan_intel.dylib)
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          bash build/build_anv.sh

      - name: Build ArcMTLDriver.bundle & Staged CLI Verification Tools
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          bash build/build_plugin.sh
          mkdir -p out/fw out/tools
          cp -f firmware/mtl_guc_70.bin out/fw/mtl_guc_70.bin

          VULKAN_INC="$PWD/third_party/Vulkan-Headers/include"
          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -O2 -Wall -I"$PWD/include" \
            tools/arc_probe.c -o out/tools/arc_probe \
            -framework IOKit -framework CoreFoundation

          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -O2 -Wall -I"$VULKAN_INC" \
            tools/vk_offscreen_test.c -o out/tools/vk_offscreen_test

          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -fobjc-arc -O2 -Wall \
            tools/mtl_offscreen_test.m -o out/tools/mtl_offscreen_test \
            -framework Foundation -framework Metal -framework IOSurface

          codesign -f -s - out/tools/arc_probe out/tools/vk_offscreen_test out/tools/mtl_offscreen_test

      - name: Verify ArcMTLDriver.bundle Translates macOS 26 Tahoe CoreDisplay default.metallib
        run: |
          python3 - <<'PY'
          import re, struct, subprocess, tempfile, pathlib
          targets = [
              ("plugin/adapt_arc_plugin.py", "kArcSelfTestFullTriVsSpv"),
              ("plugin/adapt_arc_plugin.py", "kArcSelfTestSolidFsSpv"),
              ("tools/vk_offscreen_test.c", "k_b4_vs_spv"),
              ("tools/vk_offscreen_test.c", "k_b4_fs_spv"),
          ]
          for fp, name in targets:
              src = pathlib.Path(fp).read_text(encoding="utf-8")
              m = re.search(rf"{name}\[\d+\]\s*=\s*\{{([^}}]+)\}}", src)
              assert m, f"missing {name} in {fp}"
              words = [int(x, 16) for x in re.findall(r"0x[0-9a-fA-F]+", m.group(1))]
              with tempfile.NamedTemporaryFile(suffix=".spv", delete=False) as tf:
                  tf.write(struct.pack(f"<{len(words)}I", *words))
                  spv_path = tf.name
              subprocess.run(["spirv-val", "--target-env", "vulkan1.3", spv_path], check=True)
              print(f"[OK] spirv-val validated {name} ({len(words)} words)")
          PY
          TMP_CACHE="$(mktemp -d /var/tmp/arcmtl_ci_cache.XXXXXX)"
          ARCMTL_AIRCACHE="$TMP_CACHE/aircache" \
          ARCMTL_XLATE_LIB="$PWD/out/arcmtl/libarcmtl_translate.dylib" \
            out/tools/mtl_offscreen_test --verify-bundle "$PWD/out/GPUBundles/ArcMTLDriver.bundle"
          ls -la "$TMP_CACHE/aircache" "$TMP_CACHE/spvcache" || true
          rm -rf "$TMP_CACHE"

      - name: Package Ready-to-Install Universal Distribution (macOS 26 Tahoe & 15 Sequoia)
        run: |
          DIST="ArcMTL-macos26-15-x86_64"
          rm -rf "$DIST" "$DIST.tar.gz"
          mkdir -p "$DIST/package"
          cp -R out "$DIST/out"
          cp -f package/install.sh package/uninstall.sh package/install_opencore_userspace.sh "$DIST/package/"
          chmod +x "$DIST/package/install.sh" "$DIST/package/uninstall.sh" "$DIST/package/install_opencore_userspace.sh" "$DIST/out/tools/"*
          cp -f README.md LICENSE NOTICE "$DIST/"
          tar -czf "$DIST.tar.gz" "$DIST"
          shasum -a 256 "$DIST.tar.gz"
          ls -lh "$DIST.tar.gz"

      - name: Save Cargo & ccache Build Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/ccache
            ~/.cache/ccache
            build/xlate-target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload Compiled Driver Artifact (macOS 26 & 15)
        uses: actions/upload-artifact@v4
        with:
          name: ArcMTL-macos26-15-x86_64
          path: ArcMTL-macos26-15-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 90

  verify-kexts-macos15:
    name: Verify Kernel Linking on macOS 15 Sequoia (x86_64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout ArcMTL repository
        uses: actions/checkout@v4

      - name: Build & Link-Verify Kexts on macOS 15 Sequoia
        run: |
          chmod +x kexts/*/build.sh
          bash kexts/ArcXe/build.sh "$PWD/out/kexts"
          bash kexts/ArcFB/build.sh "$PWD/out/kexts"
          ARC_TAHOE=0 bash kexts/ArcAccel/build.sh "$PWD/out/kexts/15"

          STAGE="$(mktemp -d /var/tmp/arcmtl_ci15_kc.XXXXXX)"
          mkdir -p "$STAGE/Extensions"
          sudo ditto "out/kexts/ArcXe.kext" "$STAGE/Extensions/ArcXe.kext"
          sudo ditto "out/kexts/ArcFB.kext" "$STAGE/Extensions/ArcFB.kext"
          sudo ditto "out/kexts/15/ArcAccel.kext" "$STAGE/Extensions/ArcAccel.kext"
          sudo chown -R root:wheel "$STAGE/Extensions"
          sudo chmod -R 755 "$STAGE/Extensions"
          KB="/System/Library/KernelCollections/BootKernelExtensions.kc"
          [ -f "$KB" ] || KB="/Library/Apple/System/Library/KernelCollections/BootKernelExtensions.kc"
          KS="/System/Library/KernelCollections/SystemKernelExtensions.kc"
          [ -f "$KS" ] || KS="/Library/Apple/System/Library/KernelCollections/SystemKernelExtensions.kc"
          KM_ARGS=(--allow-missing-kdk)
          [ -f "/System/Library/Kernels/kernel" ] && KM_ARGS+=(--kernel "/System/Library/Kernels/kernel")
          sudo kmutil create -n aux \
            --volume-root / \
            "${KM_ARGS[@]}" \
            -B "$KB" -S "$KS" \
            --repository "$STAGE/Extensions" \
            -A "$STAGE/test_aux.kc" -z
          kmutil inspect -a x86_64 -A "$STAGE/test_aux.kc" | grep -E "com\.arc\.(ArcXe|ArcFB|ArcAccel)"
          sudo rm -rf "$STAGE"

  build-kexts-fast:
    name: Fast Kext Build (macOS 26 & 15, ~25s)
    runs-on: macos-26-intel

    steps:
      - name: Checkout ArcMTL repository
        uses: actions/checkout@v4

      - name: Build & Package All 4 Kexts (macOS 26 Tahoe & macOS 15 Sequoia)
        run: |
          KB="/System/Library/KernelCollections/BootKernelExtensions.kc"
          [ -f "$KB" ] || KB="/Library/Apple/System/Library/KernelCollections/BootKernelExtensions.kc"
          echo "=== Checking BootKC for IOGraphicsFamily / IONDRVSupport / IOAcceleratorFamily2 ==="
          kmutil inspect -a x86_64 -B "$KB" | grep -E "IOGraphicsFamily|IONDRVSupport|IOAcceleratorFamily2|IOPCIFamily" || true
          for f in IOPCIFamily IOGraphicsFamily IOAcceleratorFamily2 IOSurface; do
            pl="/System/Library/Extensions/$f.kext/Contents/Info.plist"
            if [ -f "$pl" ]; then
              cv=$(/usr/libexec/PlistBuddy -c 'Print :OSBundleCompatibleVersion' "$pl" 2>/dev/null || echo "N/A")
              bv=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$pl" 2>/dev/null || echo "N/A")
              echo "SLE $f: CFBundleVersion=$bv OSBundleCompatibleVersion=$cv"
            fi
          done
          chmod +x kexts/*/build.sh
          bash kexts/ArcXe/build.sh "$PWD/out/kexts"
          bash kexts/ArcFB/build.sh "$PWD/out/kexts"
          ARC_TAHOE=0 bash kexts/ArcAccel/build.sh "$PWD/out/kexts/15"
          ARC_TAHOE=1 bash kexts/ArcAccel/build.sh "$PWD/out/kexts/26"
          ditto "$PWD/out/kexts/26/ArcAccel.kext" "$PWD/out/kexts/ArcAccel.kext"
          STAGE="$(mktemp -d /var/tmp/arcmtl_fast_kc.XXXXXX)"
          mkdir -p "$STAGE/Extensions"
          sudo ditto "out/kexts/ArcXe.kext" "$STAGE/Extensions/ArcXe.kext"
          sudo ditto "out/kexts/ArcFB.kext" "$STAGE/Extensions/ArcFB.kext"
          sudo ditto "out/kexts/26/ArcAccel.kext" "$STAGE/Extensions/ArcAccel.kext"
          sudo chown -R root:wheel "$STAGE/Extensions"
          sudo chmod -R 755 "$STAGE/Extensions"
          KS="/System/Library/KernelCollections/SystemKernelExtensions.kc"
          [ -f "$KS" ] || KS="/Library/Apple/System/Library/KernelCollections/SystemKernelExtensions.kc"
          KM_ARGS=(--allow-missing-kdk)
          [ -f "/System/Library/Kernels/kernel" ] && KM_ARGS+=(--kernel "/System/Library/Kernels/kernel")
          sudo kmutil create -n aux --volume-root / "${KM_ARGS[@]}" -B "$KB" -S "$KS" --repository "$STAGE/Extensions" -A "$STAGE/test_aux.kc" -z
          sudo rm -rf "$STAGE"
          mkdir -p out/tools
          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -O2 -Wall -I"$PWD/include" \
            tools/arc_probe.c -o out/tools/arc_probe \
            -framework IOKit -framework CoreFoundation
          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -fobjc-arc -O2 -Wall \
            tools/mtl_offscreen_test.m -o out/tools/mtl_offscreen_test \
            -framework Foundation -framework Metal -framework IOSurface
          codesign -f -s - out/tools/arc_probe out/tools/mtl_offscreen_test
          tar -czf ArcKexts-macos26-15-x86_64.tar.gz -C out kexts tools

      - name: Upload Fast Kexts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcKexts-macos26-15-x86_64
          path: ArcKexts-macos26-15-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 90
