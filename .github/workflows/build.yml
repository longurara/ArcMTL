name: Build ArcMTL macOS 15 Driver Stack

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos15-x86_64:
    name: Build & Verify on macOS 15 Sequoia (x86_64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout ArcMTL repository
        uses: actions/checkout@v4

      - name: Inspect macOS 15 Sequoia & Xcode environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Build Kernel Extensions (ArcXe.kext, ArcFB.kext, ArcAccel.kext)
        run: |
          chmod +x kexts/*/build.sh build/*.sh scripts/*.sh package/*.sh
          bash kexts/ArcXe/build.sh "$PWD/out/kexts"
          bash kexts/ArcFB/build.sh "$PWD/out/kexts"
          bash kexts/ArcAccel/build.sh "$PWD/out/kexts"

      - name: Verify Kernel Linking with Apple kmutil (AuxKC Pre-flight)
        run: |
          STAGE="$(mktemp -d /var/tmp/arcmtl_ci_kc.XXXXXX)"
          mkdir -p "$STAGE/Extensions"
          for k in ArcXe ArcFB ArcAccel; do
            sudo ditto "out/kexts/$k.kext" "$STAGE/Extensions/$k.kext"
            sudo chown -R root:wheel "$STAGE/Extensions/$k.kext"
            sudo chmod -R 755 "$STAGE/Extensions/$k.kext"
          done
          KB="/System/Library/KernelCollections/BootKernelExtensions.kc"
          [ -f "$KB" ] || KB="/Library/Apple/System/Library/KernelCollections/BootKernelExtensions.kc"
          KS="/System/Library/KernelCollections/SystemKernelExtensions.kc"
          [ -f "$KS" ] || KS="/Library/Apple/System/Library/KernelCollections/SystemKernelExtensions.kc"
          sudo kmutil create -n aux \
            --volume-root / \
            --bundle-path "$STAGE/Extensions/ArcXe.kext" \
            --bundle-path "$STAGE/Extensions/ArcFB.kext" \
            --bundle-path "$STAGE/Extensions/ArcAccel.kext" \
            -B "$KB" -S "$KS" \
            --repository "$STAGE/Extensions" \
            -A "$STAGE/test_aux.kc" -z
          kmutil inspect -a x86_64 -A "$STAGE/test_aux.kc" | grep -E "com\.arc\.(ArcXe|ArcFB|ArcAccel)"
          sudo rm -rf "$STAGE"

      - name: Install Userspace Toolchain Dependencies (Homebrew + Python)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          pkgs=()
          for f in meson ninja pkgconf bison flex glslang llvm spirv-llvm-translator spirv-tools libclc; do
            brew list --versions "$f" >/dev/null 2>&1 || pkgs+=("$f")
          done
          if [ "${#pkgs[@]}" -gt 0 ]; then
            brew install "${pkgs[@]}"
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            brew install rust
          elif command -v rustup >/dev/null 2>&1; then
            rustup target add x86_64-apple-darwin || true
          fi
          python3 -m pip install --user --break-system-packages mako pyyaml packaging || \
            pip3 install --user mako pyyaml packaging

      - name: Fetch & Patch Third-Party Sources (Vulkan-Headers, Mesa 25.0.7, NullMoth)
        run: |
          bash scripts/fetch_deps.sh

      - name: Build Rust AIR -> SPIR-V Translator (libarcmtl_translate.dylib)
        run: |
          bash build/build_xlate.sh

      - name: Build Mesa Intel ANV Vulkan 1.3 ICD (libvulkan_intel.dylib)
        run: |
          bash build/build_anv.sh

      - name: Build ArcMTLDriver.bundle & Staged CLI Verification Tools
        run: |
          bash build/build_plugin.sh
          mkdir -p out/fw out/tools
          cp -f firmware/mtl_guc_70.bin out/fw/mtl_guc_70.bin

          VULKAN_INC="$PWD/third_party/Vulkan-Headers/include"
          xcrun clang -arch x86_64 -O2 -Wall -I"$PWD/include" \
            tools/arc_probe.c -o out/tools/arc_probe \
            -framework IOKit -framework CoreFoundation

          xcrun clang -arch x86_64 -O2 -Wall -I"$VULKAN_INC" \
            tools/vk_offscreen_test.c -o out/tools/vk_offscreen_test

          xcrun clang -arch x86_64 -fobjc-arc -O2 -Wall \
            tools/mtl_offscreen_test.m -o out/tools/mtl_offscreen_test \
            -framework Foundation -framework Metal -framework IOSurface

          codesign -f -s - out/tools/arc_probe out/tools/vk_offscreen_test out/tools/mtl_offscreen_test

      - name: Package Ready-to-Install Distribution Archive
        run: |
          DIST="ArcMTL-macos15-x86_64"
          rm -rf "$DIST" "$DIST.tar.gz"
          mkdir -p "$DIST/package"
          cp -R out "$DIST/out"
          cp -f package/install.sh package/uninstall.sh "$DIST/package/"
          chmod +x "$DIST/package/install.sh" "$DIST/package/uninstall.sh" "$DIST/out/tools/"*
          cp -f README.md LICENSE NOTICE "$DIST/"
          tar -czf "$DIST.tar.gz" "$DIST"
          shasum -a 256 "$DIST.tar.gz"
          ls -lh "$DIST.tar.gz"

      - name: Upload Compiled Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcMTL-macos15-x86_64
          path: ArcMTL-macos15-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 90
